<text x="327" y="146" font-size="18" fill="#16212e">400,000원, 고지 없음</text>
<text x="216" y="210" font-size="18" text-anchor="end" fill="#16212e">1기 납부 999,000원</text>
<rect x="230" y="184" width="108" height="38" rx="4" fill="#b9c3cd"/>
<text x="348" y="210" font-size="18" fill="#16212e">499,000원, 고지 없음</text>
<text x="216" y="274" font-size="18" text-anchor="end" fill="#16212e">1기 납부 1,000,000원</text>
<rect x="230" y="248" width="108" height="38" rx="4" fill="#1f4e8c"/>
<text x="348" y="274" font-size="18" fill="#16212e">500,000원 고지</text>
<text x="216" y="338" font-size="18" text-anchor="end" fill="#16212e">1기 납부 2,345,678원</text>
<rect x="230" y="312" width="254" height="38" rx="4" fill="#1f4e8c"/>
<text x="494" y="338" font-size="18" fill="#16212e">1,172,000원 고지</text>
<text x="216" y="402" font-size="18" text-anchor="end" fill="#16212e">1기 납부 6,000,000원</text>
<rect x="230" y="376" width="650" height="38" rx="4" fill="#1f4e8c"/>
<text x="890" y="402" font-size="18" fill="#16212e">3,000,000원 고지</text>
<text x="970" y="504" font-size="14" text-anchor="end" fill="#8a96a3">2026년 10월 4일 국세청·국가법령정보센터 원문 기준 · 머니프로듀서</text>
</svg>
