<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="부부 합산 연소득 7천만원 이하는 대출과 신혼 우대금리, 7천만원 초과 8,500만원 이하는 대출만 되는 구간을 나눈 띠 그림" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<rect width="1200" height="630" fill="#ffffff"/>
<text x="70" y="70" font-size="36" font-weight="700" fill="#16212e">신혼부부 소득 7천만원과 8,500만원 사이가 갈림길</text>
<text x="70" y="114" font-size="23" fill="#3d4852">부부 합산 연소득 · 혼인신고 7년 이내 · 무주택 · 6억원 이하 주택 구입 기준</text>
