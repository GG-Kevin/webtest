<text x="647.8" y="430" font-size="23" font-weight="700" fill="#16212e">1,555,913원</text>
<text x="1100" y="538" font-size="16" text-anchor="end" fill="#8a96a3">2026년 10월 3일 한국주택금융공사 보금자리론 안내·업무처리기준 원문 기준 · 머니프로듀서</text>
