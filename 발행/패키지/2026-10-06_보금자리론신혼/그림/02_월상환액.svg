<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="3억원 30년 대출의 월 상환액을 우대 없음, 신혼 우대, 신혼과 청년 우대로 견준 막대 그림" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
