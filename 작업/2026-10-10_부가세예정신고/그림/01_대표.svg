<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="법인은 10월 26일까지 신고하고 개인 일반과세자는 고지서를 받는다는 두 칸 그림" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<rect width="1200" height="630" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="64" fill="#16212e"/>
<text x="60" y="42" font-size="24" font-weight="700" fill="#ffffff">2026년 제2기 부가가치세 예정신고 · 7월 1일~9월 30일 실적</text>
<text x="60" y="124" font-size="40" font-weight="700" fill="#16212e">기한은 10월 25일(일)이 아니라 10월 26일(월)</text>
<rect x="60" y="160" width="520" height="380" rx="14" fill="#e8f3ef" stroke="#0a6350" stroke-width="3"/>
<rect x="60" y="160" width="520" height="66" rx="14" fill="#0a6350"/>
<rect x="60" y="200" width="520" height="26" fill="#0a6350"/>
<text x="320" y="205" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">신고하는 쪽</text>
<circle cx="94" cy="281" r="7" fill="#0a6350"/>
<text x="114" y="290" font-size="22" fill="#16212e">법인사업자</text>
<circle cx="94" cy="345" r="7" fill="#0a6350"/>
<text x="114" y="354" font-size="22" fill="#16212e">직전 6개월 공급가액 1억5천만원 이상</text>
<circle cx="94" cy="409" r="7" fill="#0a6350"/>
<text x="114" y="418" font-size="22" fill="#16212e">10월 1일부터 신고서 제출·납부</text>
<circle cx="94" cy="473" r="7" fill="#0a6350"/>
<text x="114" y="482" font-size="22" fill="#16212e">홈택스 전자신고 또는 세무서</text>
<rect x="620" y="160" width="520" height="380" rx="14" fill="#e7eef8" stroke="#1f4e8c" stroke-width="3"/>
<rect x="620" y="160" width="520" height="66" rx="14" fill="#1f4e8c"/>
<rect x="620" y="200" width="520" height="26" fill="#1f4e8c"/>
<text x="880" y="205" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">고지서를 받는 쪽</text>
<circle cx="654" cy="281" r="7" fill="#1f4e8c"/>
<text x="674" y="290" font-size="22" fill="#16212e">개인 일반과세자</text>
<circle cx="654" cy="345" r="7" fill="#1f4e8c"/>
<text x="674" y="354" font-size="22" fill="#16212e">소규모 법인(1억5천만원 미만)</text>
<circle cx="654" cy="409" r="7" fill="#1f4e8c"/>
<text x="674" y="418" font-size="22" fill="#16212e">직전 과세기간 납부세액의 50%</text>
<circle cx="654" cy="473" r="7" fill="#1f4e8c"/>
<text x="674" y="482" font-size="22" fill="#16212e">50만원 미만이면 고지 없음</text>
<text x="60" y="580" font-size="19" fill="#5b6773">간이과세자는 1년 과세기간이라 10월 예정신고 대상이 아닙니다.</text>
<text x="1140" y="608" font-size="16" text-anchor="end" fill="#8a96a3">2026년 10월 4일 국세청·국가법령정보센터 원문 기준 · 머니프로듀서</text>
</svg>
